<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特需課程解謎事件</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 html5-qrcode 掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- 引入 confetti 慶祝彩帶套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- 引入 SortableJS 拖曳套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        @font-face {
            font-family: "Cubic 11";
            src: url("Cubic_11.woff2") format("woff2"); 
            font-display: swap;
        }
        :root {
            --main-font: "Cubic 11", sans-serif;
        }
        *, body, button, input, select, textarea, h1, h2, h3, p, span, div, label {
            font-family: var(--main-font) !important;
            font-size: 24px; 
        }
        body {
            background-color: #65C7F7;
        }
        
        .cloud-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(circle at 20% 10%, white 2%, transparent 2.5%),
                radial-gradient(circle at 23% 12%, white 3%, transparent 3.5%),
                radial-gradient(circle at 17% 12%, white 2.5%, transparent 3%),
                
                radial-gradient(circle at 80% 15%, white 2.5%, transparent 3%),
                radial-gradient(circle at 84% 17%, white 3.5%, transparent 4%),
                radial-gradient(circle at 76% 17%, white 3%, transparent 3.5%),

                radial-gradient(circle at 10% 50%, white 3%, transparent 3.5%),
                radial-gradient(circle at 14% 53%, white 4%, transparent 4.5%),
                radial-gradient(circle at 6% 53%, white 3.5%, transparent 4%),

                radial-gradient(circle at 88% 60%, white 2%, transparent 2.5%),
                radial-gradient(circle at 92% 62%, white 3%, transparent 3.5%),
                radial-gradient(circle at 84% 62%, white 2.5%, transparent 3%);
        }

        .floor {
            background-color: #FFD700;
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 44px,
                #D4AF37 44px,
                #D4AF37 48px
            );
            border-top: 24px solid #F3F4F6;
        }

        .piece {
            transition: transform 0.1s;
            touch-action: none;
            user-select: none;
        }
        .piece.sortable-drag {
            opacity: 0.8;
            transform: scale(1.1);
        }

        .dropzone .piece {
            width: 100% !important;
            height: 100% !important;
            box-shadow: none !important;
            border-radius: 4px !important;
            line-height: 1 !important;
        }

        .title-3d {
            color: #FFD700;
            text-shadow: 
                -3px -3px 0 #003366, 3px -3px 0 #003366, 
                -3px 3px 0 #003366, 3px 3px 0 #003366,
                0px 6px 0 #003366;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-8 relative overflow-x-hidden">
    <div class="cloud-bg"></div>

    <audio id="bgMusic" loop>
        <source src="BGM.mp3" type="audio/mpeg">
    </audio>

    <!-- 操控區：重置與測試放在左邊 -->
    <button id="reset-btn" class="absolute top-4 left-4 text-gray-800/10 text-[12px] font-bold bg-transparent z-50 cursor-pointer hover:text-gray-800/50 transition-all">
        重置
    </button>

    <button id="test-btn" class="absolute top-4 left-16 text-gray-800/10 text-[12px] font-bold bg-transparent z-50 cursor-pointer hover:text-gray-800/50 transition-all">
        測試
    </button>

    <!-- 操控區：音樂圖示獨立放在右邊 -->
    <button id="music-btn" class="absolute top-4 right-4 text-gray-800/10 z-50 cursor-pointer hover:text-gray-800/50 transition-all flex items-center justify-center">
        <svg id="icon-vol-up" class="hidden" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px; height:16px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
        </svg>
        <svg id="icon-vol-off" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px; height:16px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
        </svg>
    </button>

    <h1 class="text-[48px] font-black mb-6 text-center tracking-wide relative z-10 leading-tight mx-auto title-3d">
        特需課程<br>解謎事件
    </h1>

    <div id="scanner-container" class="w-full max-w-sm px-4 mb-6 z-10 flex flex-col items-center mx-auto">
        <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
        <button id="start-btn" class="mt-4 bg-[#FF0000] text-white font-black py-2 px-8 rounded-full shadow-md hover:bg-red-700 transition tracking-widest w-auto cursor-pointer border-none text-[24px]">
            LET'S PLAY!
        </button>
        <p id="error-msg" class="text-white text-center mt-2 font-bold drop-shadow-md text-[24px]"></p>
    </div>

    <div id="progress-area" style="display: none;" class="w-full max-w-[1200px] px-4 z-10 pb-36 grid grid-cols-1 lg:grid-cols-3 gap-6 mx-auto">
        
        <div class="bg-white p-4 rounded-xl shadow-lg border-4 border-[#003366] flex flex-col h-full">
            <h2 class="text-[24px] font-black text-[#003366] text-center mb-4 border-b-4 border-[#FFD700] inline-block mx-auto flex justify-center w-max pb-1">線索一 (<span id="wang-count">0</span>/7)</h2>
            <div id="wang-collection" class="flex flex-col gap-2 items-center flex-grow"></div>
            <div id="wang-assembly" class="hidden w-full flex-grow">
                <div id="target-wang" class="flex gap-2 justify-center mb-4 min-h-[96px]"></div>
                <div id="pool-wang" class="flex flex-wrap gap-2 justify-center p-3 bg-yellow-50 rounded-xl border-2 border-dashed border-yellow-400 min-h-[72px]"></div>
            </div>
            <div id="wang-done" class="hidden text-[36px] font-black text-[#003366] text-center tracking-widest py-4 mt-auto"></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-lg border-4 border-[#003366] flex flex-col h-full">
            <h2 class="text-[24px] font-black text-[#003366] text-center mb-4 border-b-4 border-[#FFD700] inline-block mx-auto flex justify-center w-max pb-1">線索二 (<span id="lin-count">0</span>/7)</h2>
            <div id="lin-collection" class="flex flex-col gap-2 items-center flex-grow"></div>
            <div id="lin-assembly" class="hidden w-full flex-grow">
                <div id="target-lin" class="flex gap-2 justify-center mb-4 min-h-[96px]"></div>
                <div id="pool-lin" class="flex flex-wrap gap-2 justify-center p-3 bg-yellow-50 rounded-xl border-2 border-dashed border-yellow-400 min-h-[72px]"></div>
            </div>
            <div id="lin-done" class="hidden text-[36px] font-black text-[#003366] text-center tracking-widest py-4 mt-auto"></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-lg border-4 border-[#003366] flex flex-col h-full">
            <h2 class="text-[24px] font-black text-[#003366] text-center mb-4 border-b-4 border-[#FFD700] inline-block mx-auto flex justify-center w-max pb-1">線索三 (<span id="eng-count">0</span>/13)</h2>
            <div id="eng-collection" class="flex flex-col gap-2 items-center flex-grow"></div>
            <div id="eng-assembly" class="hidden w-full flex-grow">
                <div id="target-eng" class="flex flex-col gap-2 justify-center mb-4 min-h-[96px]"></div>
                <div id="pool-eng" class="flex flex-wrap gap-2 justify-center p-3 bg-yellow-50 rounded-xl border-2 border-dashed border-yellow-400 min-h-[72px]"></div>
            </div>
            <div id="eng-done" class="hidden text-[48px] font-black text-[#FF0000] text-center tracking-widest leading-relaxed py-4 mt-auto"></div>
        </div>
    </div>

    <div class="floor absolute bottom-0 left-0 w-full h-24 z-0"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKitKzkqS5_K7lehivcAAZoGX_u4-LsQs",
            authDomain: "typeace-c8f54.firebaseapp.com",
            projectId: "typeace-c8f54",
            storageBucket: "typeace-c8f54.firebasestorage.app",
            messagingSenderId: "544799963119",
            appId: "1:544799963119:web:25dbee6e8bad94ef70a81a",
            measurementId: "G-2XZL871D6V",
            databaseURL: "https://typeace-c8f54-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const piecesRef = ref(db, 'pieces');

        const puzzlePieces = {
            "P1": { char: "一", group: "wang" }, "P2": { char: "土", group: "wang" },
            "P3": { char: "口", group: "wang" }, "P4": { char: "壬", group: "wang" },
            "P5": { char: "口", group: "wang" }, "P6": { char: "大", group: "wang" },
            "P7": { char: "心", group: "wang" },
            "P8": { char: "木", group: "lin" }, "P9": { char: "木", group: "lin" },
            "P10": { char: "文", group: "lin" }, "P11": { char: "厂", group: "lin" },
            "P12": { char: "彡", group: "lin" }, "P13": { char: "丹", group: "lin" },
            "P14": { char: "彡", group: "lin" },
            "P15": { char: "H", group: "eng" }, "P16": { char: "A", group: "eng" },
            "P17": { char: "P", group: "eng" }, "P18": { char: "P", group: "eng" },
            "P19": { char: "Y", group: "eng" }, "P20": { char: "B", group: "eng" },
            "P21": { char: "I", group: "eng" }, "P22": { char: "R", group: "eng" },
            "P23": { char: "T", group: "eng" }, "P24": { char: "H", group: "eng" },
            "P25": { char: "D", group: "eng" }, "P26": { char: "A", group: "eng" },
            "P27": { char: "Y", group: "eng" }
        };

        let collected = { wang: [], lin: [], eng: [] };
        let html5QrcodeScanner;
        
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("music-btn");
        const iconVolUp = document.getElementById("icon-vol-up");
        const iconVolOff = document.getElementById("icon-vol-off");

        const isDisplayMode = window.location.search.includes('mode=display');
        const isScannerMode = window.location.search.includes('mode=scanner');

        function updateMusicIcon() {
            if (bgMusic.paused) {
                iconVolUp.classList.add('hidden');
                iconVolOff.classList.remove('hidden');
            } else {
                iconVolUp.classList.remove('hidden');
                iconVolOff.classList.add('hidden');
            }
        }

        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().then(updateMusicIcon).catch(e => console.log(e));
            } else {
                bgMusic.pause();
                updateMusicIcon();
            }
        });

        function createCollectionSlots(group, layouts) {
            const container = document.getElementById(`${group}-collection`);
            container.innerHTML = '';
            let idCounter = 1;
            layouts.forEach(count => {
                const row = document.createElement('div');
                row.className = 'flex gap-2 justify-center w-full flex-nowrap';
                for (let i = 0; i < count; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'w-[36px] h-[36px] border-2 border-dashed border-[#003366] rounded-lg flex items-center justify-center bg-white flex-none';
                    slot.id = `${group}-slot-${idCounter++}`;
                    row.appendChild(slot);
                }
                container.appendChild(row);
            });
        }

        function initBoard() {
            createCollectionSlots('wang', [2, 2, 3]);
            createCollectionSlots('lin', [2, 3, 2]);
            createCollectionSlots('eng', [5, 5, 3]);
        }

        function revealProgressArea() {
            if (!isScannerMode) {
                document.getElementById('progress-area').style.display = 'grid';
            }
        }

        function createCharGrid(direction, slotsCount, prefix) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-1 p-1 border-2 border-[#003366] bg-white rounded-xl flex-none w-[96px] h-[96px] ${direction === 'tb' ? 'flex-col' : 'flex-row'}`;
            for(let i = 0; i < slotsCount; i++) {
                const slot = document.createElement('div');
                slot.className = `dropzone flex-1 flex items-center justify-center border border-dashed border-[#003366] bg-white min-h-0 min-w-0 rounded-md`;
                slot.id = `${prefix}-${i+1}`;
                wrapper.appendChild(slot);
            }
            return wrapper;
        }

        function showTargetArea(group) {
            document.getElementById(`${group}-collection`).style.display = 'none';
            document.getElementById(`${group}-assembly`).style.display = 'block';

            const targetContainer = document.getElementById(`target-${group}`);
            const pool = document.getElementById(`pool-${group}`);
            targetContainer.innerHTML = '';
            pool.innerHTML = '';

            if (group === 'wang') {
                targetContainer.appendChild(createCharGrid('tb', 2, 'wang-t1'));
                targetContainer.appendChild(createCharGrid('tb', 2, 'wang-t2'));
                targetContainer.appendChild(createCharGrid('tb', 3, 'wang-t3'));
            } else if (group === 'lin') {
                targetContainer.appendChild(createCharGrid('lr', 2, 'lin-t1'));
                targetContainer.appendChild(createCharGrid('tb', 3, 'lin-t2'));
                targetContainer.appendChild(createCharGrid('lr', 2, 'lin-t3'));
            } else if (group === 'eng') {
                const layouts = [5, 5, 3];
                let slotId = 1;
                layouts.forEach(count => {
                    const row = document.createElement('div');
                    row.className = 'flex gap-2 justify-center w-full flex-nowrap';
                    for(let i = 0; i < count; i++) {
                        const slot = document.createElement('div');
                        slot.className = 'dropzone w-[36px] h-[36px] border-2 border-dashed border-[#003366] rounded-lg flex items-center justify-center bg-white flex-none';
                        slot.id = `eng-t-${slotId++}`;
                        row.appendChild(slot);
                    }
                    targetContainer.appendChild(row);
                });
            }

            const pieces = collected[group].sort(() => Math.random() - 0.5);
            pieces.forEach(p => {
                const pieceDiv = document.createElement('div');
                pieceDiv.className = 'piece w-[36px] h-[36px] flex items-center justify-center font-bold rounded-lg bg-[#FFD700] text-[#003366] border-2 border-[#003366] shadow-[0_4px_0_#003366] cursor-grab flex-none text-[24px]';
                pieceDiv.innerText = p.char;
                pool.appendChild(pieceDiv);
            });

            Sortable.create(pool, {
                group: { name: group, put: true },
                animation: 150,
                fallbackOnBody: true,
                swapThreshold: 0.65
            });

            document.querySelectorAll(`#target-${group} .dropzone`).forEach(dz => {
                Sortable.create(dz, {
                    group: {
                        name: group,
                        put: function (to) { return to.el.children.length < 1; }
                    },
                    animation: 150,
                    fallbackOnBody: true,
                    onAdd: function () { checkCompletion(group); }
                });
            });
        }

        function getAns(checks) {
            for(let [id, char] of checks) {
                const dz = document.getElementById(id);
                if (!dz || dz.children.length === 0 || dz.children[0].innerText.trim() !== char) return false;
            }
            return true;
        }

        function checkCompletion(group) {
            if (group === 'wang') {
                if(getAns([['wang-t1-1', '一'], ['wang-t1-2', '土'], ['wang-t2-1', '口'], ['wang-t2-2', '壬'], ['wang-t3-1', '口'], ['wang-t3-2', '大'], ['wang-t3-3', '心']])) {
                    triggerMerge('wang', '王呈恩');
                }
            } else if (group === 'lin') {
                if(getAns([['lin-t1-1', '木'], ['lin-t1-2', '木'], ['lin-t2-1', '文'], ['lin-t2-2', '厂'], ['lin-t2-3', '彡'], ['lin-t3-1', '丹'], ['lin-t3-2', '彡']])) {
                    triggerMerge('lin', '林彥彤');
                }
            } else if (group === 'eng') {
                const correctEng = ['H','A','P','P','Y','B','I','R','T','H','D','A','Y'];
                let isCorrect = true;
                for(let i=0; i<13; i++) {
                    const dz = document.getElementById(`eng-t-${i+1}`);
                    if (!dz || dz.children.length === 0 || dz.children[0].innerText.trim() !== correctEng[i]) {
                        isCorrect = false;
                        break;
                    }
                }
                if(isCorrect) triggerMerge('eng', 'HAPPY<br>BIRTHDAY');
            }
        }

        function triggerMerge(group, finalHtml) {
            document.getElementById(`${group}-assembly`).style.display = 'none';
            const doneDiv = document.getElementById(`${group}-done`);
            doneDiv.innerHTML = finalHtml;
            doneDiv.style.display = 'block';
            doneDiv.classList.add('animate-bounce');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        
        onValue(piecesRef, (snapshot) => {
            const data = snapshot.val() || {};
            
            collected = { wang: [], lin: [], eng: [] };
            initBoard(); 
            
            if(Object.keys(data).length > 0 && !isScannerMode) revealProgressArea();

            Object.keys(data).forEach(key => {
                if (puzzlePieces[key]) {
                    const p = puzzlePieces[key];
                    collected[p.group].push({ key: key, char: p.char });
                    
                    document.getElementById(`${p.group}-count`).innerText = collected[p.group].length;
                    
                    const slot = document.getElementById(`${p.group}-slot-${collected[p.group].length}`);
                    if (slot) {
                        slot.innerHTML = `<span>${p.char}</span>`;
                        slot.className = 'w-[36px] h-[36px] border-2 border-[#003366] rounded-lg flex items-center justify-center bg-[#FFD700] text-[#003366] font-bold flex-none scale-110 transition-transform duration-300 shadow-[0_4px_0_#003366] text-[24px]';
                        setTimeout(() => slot.classList.remove('scale-110'), 300);
                    }
                }
            });

            if (!isScannerMode) {
                ['wang', 'lin', 'eng'].forEach(group => {
                    const max = group === 'eng' ? 13 : 7;
                    if (collected[group].length === max) {
                        const collectionDiv = document.getElementById(`${group}-collection`);
                        if (collectionDiv && collectionDiv.style.display !== 'none') {
                            setTimeout(() => showTargetArea(group), 800);
                        }
                    }
                });
            }
        });

        function onScanSuccess(decodedText) {
            revealProgressArea();
            const key = decodedText.trim().toUpperCase();
            if (puzzlePieces[key]) {
                set(ref(db, 'pieces/' + key), true);
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            if (!isScannerMode) {
                bgMusic.play().then(updateMusicIcon).catch(error => console.log("音樂播放受限", error));
            }
            
            revealProgressArea();
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('reader').classList.add('border-4', 'border-[#003366]', 'shadow-lg');
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                document.getElementById('error-msg').innerText = "無法開啟相機，請確定有允許瀏覽器使用相機權限喔！";
                document.getElementById('start-btn').style.display = 'inline-block';
                document.getElementById('reader').classList.remove('border-4', 'border-[#003366]', 'shadow-lg');
            });
        });

        document.getElementById('test-btn').addEventListener('click', () => {
            bgMusic.play().then(updateMusicIcon).catch(error => console.log("音樂播放受限", error));
            
            if(html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch(e) {}
            }
            document.getElementById('scanner-container').style.display = 'none';
            revealProgressArea();
            const allPieces = {};
            Object.keys(puzzlePieces).forEach(k => allPieces[k] = true);
            set(ref(db, 'pieces'), allPieces);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm("確定要清空雲端所有收集紀錄重新開始嗎？")) {
                set(ref(db, 'pieces'), null).then(() => {
                    location.reload();
                }).catch(err => {
                    console.error(err);
                    alert("重置失敗，請確認 Firebase 資料庫權限是否開啟！");
                });
            }
        });

        window.onload = () => {
            initBoard();
            
            if (isDisplayMode) {
                document.getElementById('scanner-container').style.display = 'none';
                document.getElementById('test-btn').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'none';
                revealProgressArea();
                
                document.body.addEventListener('click', () => {
                    bgMusic.play().then(updateMusicIcon).catch(error => console.log("音樂播放受限", error));
                }, { once: true });
                
            } else if (isScannerMode) {
                document.getElementById('test-btn').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'none';
                document.getElementById('music-btn').style.display = 'none';
            }
        };
    </script>
</body>
</html>
